{% extends "base.html" %}
{% block title %}Application Detail – Admin{% endblock %}
{% block content %}
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:#f9fafb;color:#111827}
  a{text-decoration:none;color:inherit}
  .admin-wrap{display:flex;min-height:100vh}
  .sidebar{width:240px;background:#1e293b;color:white;padding:1.5rem 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar-logo{padding:0 1.25rem 1.5rem;font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700;color:white;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:1rem}
  .sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.25rem;color:rgba(255,255,255,.7);font-size:.9rem;font-weight:500;transition:background .15s,color .15s}
  .sidebar-link:hover,.sidebar-link.active{background:rgba(255,255,255,.08);color:white}
  .main-area{flex:1;padding:2rem;min-width:0}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:#2563eb;font-size:.9rem;margin-bottom:1.5rem}
  .back-link:hover{text-decoration:underline}
  .page-title{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:900;margin-bottom:.25rem}
  .page-sub{color:#6b7280;font-size:.9rem;margin-bottom:2rem}
  .card{background:white;border-radius:14px;border:1px solid #e5e7eb;padding:1.5rem;margin-bottom:1.5rem}
  .card h2{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:700;margin-bottom:1rem;color:#111827}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
  @media(max-width:700px){.grid-2{grid-template-columns:1fr}}
  .info-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid #f3f4f6;font-size:.9rem}
  .info-row:last-child{border-bottom:none}
  .info-row .lbl{color:#6b7280}
  .info-row .val{font-weight:600;color:#111827}
  .status-badge{display:inline-flex;align-items:center;padding:5px 14px;border-radius:20px;font-size:.82rem;font-weight:600}
  .doc-item{display:flex;align-items:center;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid #f3f4f6;font-size:.9rem}
  .doc-item:last-child{border-bottom:none}
  .doc-done{color:#15803d;font-weight:600}
  .doc-pending{color:#9ca3af}
  .doc-link{color:#2563eb;font-size:.82rem;font-weight:600}
